[project]
name = "nescio-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "numpy==2.5.4",
    "pgvector==0.5.1",
    "sqlalchemy==2.1.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.lint.flake8-tidy-imports]
# Enforce the root-relative `src.*` import convention; see CLAUDE.md.
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src", "seeds"]
# src/ has no __init__.py; anchor module names at the project root so
# src.models.base is not also seen as models.base.
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
disallow_untyped_defs = true
